<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UrriChat</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23007bff%22/><path d=%22M30 35h40v25H45L30 75V35z%22 fill=%22white%22/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    
    <style>
        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
        html, body { 
            height: 100%; 
            width: 100%;
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #0f0f12;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
        }

        #login, #contacts-container, #chat-container {
            display: none;
            width: 100%;
            height: 100dvh; 
            position: relative;
        }

        #contacts-container, #chat-container { flex-direction: column; }

        #login { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 25px; text-align: center; }
        .login-box {
            width: 85%; max-width: 380px; padding: 40px;
            background: rgba(26, 26, 32, 0.8); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
        }

        #username, #password { 
            width: 100%; text-align: center; padding: 14px 20px; border-radius: 15px; 
            border: 2px solid #2c2c34; background: #0f0f12; color: white; font-size: 16px; margin-bottom: 15px;
        }

        #login-btn { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; }

        .header { 
            height: 65px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 15px; 
            background: #1a1a20; 
            border-bottom: 1px solid #333; 
            z-index: 1000;
        }

        #lista-usuarios, #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px 0; 
            display: flex; 
            flex-direction: column; 
            -webkit-overflow-scrolling: touch; 
        }

        .msg-container { display: flex; width: 100%; padding: 2px 12px; margin-bottom: 4px; transition: background 0.2s; position: relative; }
        .msg-container.selected { background: rgba(0, 123, 255, 0.15); }
        .msg-container.me { justify-content: flex-end; }
        .msg-container.other { justify-content: flex-start; }

        .msg { padding: 8px 12px; border-radius: 18px; max-width: 85%; position: relative; word-wrap: break-word; cursor: pointer; }
        .msg.me { background: #007bff; border-bottom-right-radius: 4px; color: white; }
        .msg.other { background: #2c2c34; border-bottom-left-radius: 4px; color: white; }

        .reply-box { background: rgba(0,0,0,0.15); border-left: 4px solid #007bff; padding: 5px 8px; border-radius: 5px; margin-bottom: 5px; font-size: 12px; }
        #reply-preview { display: none; background: #1a1a20; padding: 10px 15px; border-top: 1px solid #333; }

        .input-area { padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: #1a1a20; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        textarea#msg-input { flex: 1; padding: 10px 15px; border-radius: 22px; border: none; background: #2c2c34; color: white; outline: none; resize: none; font-size: 16px; max-height: 120px; }
        
        /* --- ESTILO DE BOTONES UNIFICADO (BORDES SUAVES) --- */
        .btn-header, .btn-icon { 
            background: rgba(255, 255, 255, 0.03); 
            color: #007bff; 
            border: 1px solid rgba(0, 123, 255, 0.4); 
            width: 38px;
            height: 38px;
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-icon:active { background: rgba(0, 123, 255, 0.1); transform: scale(0.9); }

        .footer-btn { background: transparent; border: none; color: #007bff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; min-width: 35px; }
        button#main-btn { width: 45px; height: 45px; background: #007bff; color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        .contact-card { background: #1a1a20; padding: 15px; margin: 8px 12px; border-radius: 15px; border: 1px solid #2c2c34; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .contact-card:active { transform: scale(0.98); background: #2c2c34; }
        .unread-badge { background: #007bff; color: white; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: bold; margin-right: 8px; }
        .online-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .dot-online { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .dot-offline { background-color: #ff4444; }

        #reaction-selector { display: none; position: fixed; background: #1a1a20; border: 1px solid #333; padding: 10px; border-radius: 20px; z-index: 2000; grid-template-columns: repeat(5, 1fr); gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .emoji-item { cursor: pointer; font-size: 1.4rem; transition: transform 0.1s; }
        .emoji-item:active { transform: scale(1.3); }
        
        .emoji-picker { display: none; position: absolute; bottom: 80px; left: 10px; background: #1a1a20; border: 1px solid #333; padding: 12px; border-radius: 20px; grid-template-columns: repeat(5, 1fr); gap: 10px; z-index: 100; max-height: 250px; overflow-y: auto; }
        
        .status-info { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; font-size: 10px; opacity: 0.7; }
        
        #scroll-down { position: fixed; bottom: 90px; right: 20px; background: #007bff; color: white; width: 40px; height: 40px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 90; }
        
        .recording { color: #ff4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="cerrarSelectores()">

    <div id="login">
        <div class="login-box">
            <i class="fas fa-comments" style="font-size: 4.5rem; color: #007bff; margin-bottom: 10px;"></i>
            <h1 style="color: #007bff; font-size: 2.8rem; margin: 0;">UrriChat</h1>
            <p style="color: #888; margin-bottom: 25px;">¡TU CHAT FAVORITO!</p>
            <input type="text" id="username" placeholder="Usuario..." autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña..." autocomplete="off">
            <button id="login-btn" onclick="registrarUsuario()">CONECTAR</button>
        </div>
    </div>

    <div id="contacts-container">
        <div class="header">
            <span id="mi-perfil" style="font-weight: bold; color: #2ecc71;"></span>
            <div style="display: flex; gap: 8px;">
                <button class="btn-header" onclick="editarNombre()"><i class="fas fa-user-edit"></i></button>
                <button class="btn-header" style="color:#ff4444; border-color:rgba(255, 68, 68, 0.4)" onclick="confirmarSalida()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="lista-usuarios">
            <div class="contact-card" onclick="abrirChat('muro', 'CHAT GRUPAL')" style="border-left: 5px solid #007bff;">
                <span><i class="fas fa-users" style="margin-right: 10px; color: #007bff;"></i> CHAT GRUPAL</span>
                <div style="display:flex; align-items:center;">
                    <div id="badge-muro"></div>
                    <span class="online-dot dot-online"></span>
                </div>
            </div>
            <p style="color: #666; font-size: 14px; margin: 15px 20px;">Usuarios De UrriChat</p>
            <div id="usuarios-conectados"></div>
        </div>
    </div>

    <div id="chat-container">
        <div class="header" id="chat-header-normal">
            <button class="btn-icon" onclick="volverAContactos()"><i class="fas fa-chevron-left"></i></button>
            
            <div style="text-align: center; flex: 1;">
                <span id="chat-title" style="font-weight: bold; display: block;">Chat</span>
                <div id="chat-header-status" style="font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                    <span id="header-status-text"></span>
                </div>
                <span id="chat-subtitle" style="font-size: 10px; color: #2ecc71; display: none;">Escribiendo...</span>
            </div>
            
            <button class="btn-icon" style="color:#ff4444; border-color:rgba(255, 68, 68, 0.4);" onclick="vaciarChat()"><i class="fas fa-trash-alt"></i></button>
        </div>

        <div class="header" id="chat-header-selection" style="display: none;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn-icon" onclick="cancelarSeleccion()"><i class="fas fa-times"></i></button>
                <span id="selection-count" style="font-weight: bold; color: #007bff; font-size: 1.2rem;">1</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="reply-btn-header" class="btn-icon" onclick="prepararRespuesta()"><i class="fas fa-reply"></i></button>
                <button class="btn-icon" style="color: #ff4444; border-color:rgba(255, 68, 68, 0.4);" onclick="borrarMensajesSeleccionados()"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>

        <div id="messages" onscroll="handleScroll(this)"></div>
        <button id="scroll-down" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></button>

        <div id="reply-preview">
            <div class="reply-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong id="reply-user" style="color: #007bff; font-size: 11px;">Nombre</strong>
                    <i class="fas fa-times" onclick="cancelarRespuesta()" style="cursor:pointer; font-size: 12px; opacity: 0.6;"></i>
                </div>
                <p id="reply-text" style="margin: 3px 0; font-size: 13px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></p>
            </div>
        </div>

        <div class="input-area">
            <div id="emoji-picker" class="emoji-picker" onclick="event.stopPropagation()">
                <span class="emoji-item" onclick="addEmoji('😃')">😃</span><span class="emoji-item" onclick="addEmoji('😂')">😂</span>
                <span class="emoji-item" onclick="addEmoji('😬')">😬</span><span class="emoji-item" onclick="addEmoji('😘')">😘</span>
                <span class="emoji-item" onclick="addEmoji('🥹')">🥹</span><span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
                <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span><span class="emoji-item" onclick="addEmoji('🎉')">🎉</span>
                <span class="emoji-item" onclick="addEmoji('👍')">👍</span><span class="emoji-item" onclick="addEmoji('🙏')">🙏</span>
                <span class="emoji-item" onclick="addEmoji('🍑')">🍑</span><span class="emoji-item" onclick="addEmoji('🍆')">🍆</span>
                <span class="emoji-item" onclick="addEmoji('🍻')">🍻</span><span class="emoji-item" onclick="addEmoji('⛽')">⛽</span>
                <span class="emoji-item" onclick="addEmoji('🇻🇪')">🇻🇪</span><span class="emoji-item"
            </div>
            <button class="footer-btn" onclick="toggleEmojiPicker(event)"><i class="far fa-smile"></i></button>
            <input type="file" id="file-input" style="display:none" onchange="enviarArchivo(this)">
            <button class="footer-btn" onclick="document.getElementById('file-input').click()"><i class="fas fa-paperclip"></i></button>
            <button class="footer-btn" id="mic-btn" onclick="toggleAudio()"><i class="fas fa-microphone"></i></button>
            <textarea id="msg-input" placeholder="Mensaje..." rows="1" oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
            <button id="main-btn" onclick="enviar()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="reaction-selector" onclick="event.stopPropagation()">
        <span class="emoji-item" onclick="aplicarReaccion('😬')">😬</span><span class="emoji-item" onclick="aplicarReaccion('❤️')">❤️</span>
        <span class="emoji-item" onclick="aplicarReaccion('🔥')">🔥</span><span class="emoji-item" onclick="aplicarReaccion('👍')">👍</span>
        <span class="emoji-item" onclick="aplicarReaccion('🙏')">🙏</span><span class="emoji-item"
    </div>

    <script>
        // Mantenemos toda tu lógica de Firebase y funciones intacta
        const firebaseConfig = {
            apiKey: "AIzaSyA7XKmn8f1w6hAVUZaS8Eui7FAnZRy0Myg",
            authDomain: "urrichatapp.firebaseapp.com",
            databaseURL: "https://urrichatapp-default-rtdb.firebaseio.com",
            projectId: "urrichatapp",
            storageBucket: "urrichatapp.firebasestorage.app",
            messagingSenderId: "504734750650",
            appId: "1:504734750650:web:51a8def62934aabbeb2f83"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        let usuarioActual = "";
        let salaActual = "";
        let typingTimeout, mediaRecorder, audioChunks = [], isRecording = false;
        let msgIdParaReaccionar = "";
        let mensajesSeleccionados = [];
        let mensajeParaResponder = null;
        let pressTimer;
        let estaEscribiendoAlguien = false; 
        let badgeListeners = {};

        // Fix para teclado en Android
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const chat = document.getElementById('chat-container');
                if (chat.style.display === 'flex') {
                    chat.style.height = window.visualViewport.height + 'px';
                    setTimeout(scrollToBottom, 100);
                }
            });
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
            if (salaActual) db.ref(`typing/${salaActual}/${usuarioActual}`).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { if(salaActual) db.ref(`typing/${salaActual}/${usuarioActual}`).set(false); }, 1500);
        }

        function checkEnter(e) { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 768) { e.preventDefault(); enviar(); } }

        function registrarUsuario(persistente) {
            let user = persistente || document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();
            if (user) {
                if (persistente) { completarLogin(user); return; }
                if (!pass) { alert("Por favor, ingresa una contraseña"); return; }
                db.ref("credenciales/" + user).once("value", (snapshot) => {
                    if (snapshot.exists()) {
                        if (snapshot.val() === pass) completarLogin(user);
                        else alert("Contraseña incorrecta.");
                    } else {
                        db.ref("credenciales/" + user).set(pass);
                        completarLogin(user);
                    }
                });
            }
        }

        function completarLogin(user) {
            usuarioActual = user;
            localStorage.setItem('urrichat_user', user);
            const userRef = db.ref("usuarios/" + user);
            db.ref(".info/connected").on("value", (snap) => {
                if (snap.val()) { userRef.onDisconnect().set("offline"); userRef.set("online"); }
            });
            
            document.getElementById('login').style.display = 'none';
            document.getElementById('mi-perfil').innerText = user;
            
            escucharUsuarios();
            verificarMensajesNuevos('muro');

            const ultimaSala = localStorage.getItem('urrichat_last_room');
            const ultimoTitulo = localStorage.getItem('urrichat_last_title');
            if (ultimaSala && ultimaSala !== "contacts") { 
                abrirChat(ultimaSala, ultimoTitulo || "Chat"); 
            } else { 
                document.getElementById('contacts-container').style.display = 'flex'; 
            }
        }

        function escucharUsuarios() {
            db.ref("usuarios").on("value", (snap) => {
                const list = document.getElementById("usuarios-conectados");
                list.innerHTML = "";
                snap.forEach((child) => {
                    const uKey = child.key;
                    if (uKey !== usuarioActual) {
                        const salaID = "privado_" + [usuarioActual, uKey].sort().join("_");
                        const isOnline = child.val() === 'online';
                        const card = document.createElement("div");
                        card.className = "contact-card";
                        card.onclick = () => abrirChat(salaID, uKey);
                        card.innerHTML = `<span><i class="fas fa-user" style="margin-right:10px; color: #007bff;"></i>${uKey}</span>
                                          <div style="display:flex;align-items:center">
                                            <div id="badge-${salaID}"></div>
                                            <span class="online-dot ${isOnline ? 'dot-online' : 'dot-offline'}"></span>
                                          </div>`;
                        list.appendChild(card);
                        verificarMensajesNuevos(salaID);
                    }
                });
            });
        }

        function verificarMensajesNuevos(id) {
            if (badgeListeners[id]) return;
            badgeListeners[id] = true;
            db.ref(id).on("value", (snap) => {
                const b = document.getElementById(`badge-${id}`);
                if (!b || salaActual === id) return;
                let count = 0;
                snap.forEach(m => { if (m.val().u !== usuarioActual && m.val().r === false) count++; });
                b.innerHTML = count > 0 ? `<span class="unread-badge">${count}</span>` : "";
            });
        }

        function abrirChat(id, title) {
            if(salaActual) { db.ref(salaActual).off(); db.ref(`typing/${salaActual}`).off(); }
            
            salaActual = id;
            cancelarSeleccion(); 
            cancelarRespuesta();
            
            localStorage.setItem('urrichat_last_room', id); 
            localStorage.setItem('urrichat_last_title', title);
            
            document.getElementById('contacts-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'flex';
            document.getElementById('chat-title').innerText = title;
            
            if(title !== 'Chat Grupal') {
                db.ref("usuarios/" + title).on("value", (snap) => {
                    const statusText = document.getElementById('header-status-text');
                    statusText.innerText = snap.val() === 'online' ? 'Conectado' : 'Desconectado';
                    statusText.style.color = snap.val() === 'online' ? '#2ecc71' : '#ff4444';
                });
            } else {
                document.getElementById('header-status-text').innerText = "";
            }

            escucharMensajes(); 
            escucharEscritura();
            
            const b = document.getElementById(`badge-${id}`); 
            if(b) b.innerHTML = "";
        }

        function escucharEscritura() {
            db.ref(`typing/${salaActual}`).on("value", (snap) => {
                estaEscribiendoAlguien = false;
                snap.forEach(child => { if (child.key !== usuarioActual && child.val() === true) estaEscribiendoAlguien = true; });
                document.getElementById('chat-subtitle').style.display = estaEscribiendoAlguien ? 'block' : 'none';
                document.getElementById('chat-header-status').style.display = estaEscribiendoAlguien ? 'none' : 'flex';
            });
        }
        
        function renderContent(d, esMio) {
            let html = d.reply ? `<div class="reply-box" style="border-left-color: ${esMio?'#fff':'#007bff'}"><small><strong>${d.reply.u}</strong></small><br><small>${d.reply.t}</small></div>` : "";
            if(!esMio && salaActual === 'muro') html += `<small style="color:#007bff; font-weight:bold; font-size:11px; display:block; margin-bottom:2px;">${d.u}</small>`;
            if(d.t) html += `<span>${d.t}</span>`;
            if(d.file) {
                if(d.fileType?.includes("image")) html += `<img src="${d.file}" style="max-width:100%; border-radius:12px; margin-top:5px; display:block;">`;
                else if(d.fileType?.includes("audio")) html += `<audio controls src="${d.file}" style="width:210px; height:40px; margin-top:5px; display:block;"></audio>`;
                else html += `<a href="${d.file}" target="_blank" style="color:#007bff; font-size:12px; display:block; margin-top:5px;">📂 Archivo</a>`;
            }
            if(d.reacciones) {
                html += `<div style="display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;">`;
                for(let e in d.reacciones) html += `<span style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:10px; font-size:11px;">${e} ${d.reacciones[e]}</span>`;
                html += `</div>`;
            }
            return html;
        }

        function escucharMensajes() {
            const box = document.getElementById("messages"); 
            box.innerHTML = ""; 
            
            db.ref(salaActual).limitToLast(50).on("child_added", (snap) => {
                const d = snap.val(); const key = snap.key; const esMio = d.u === usuarioActual;
                if(!esMio && d.r === false) db.ref(`${salaActual}/${key}/r`).set(true);

                const div = document.createElement("div");
                div.id = `cont-${key}`;
                div.className = `msg-container ${esMio?'me':'other'}`;
                div.onclick = () => manejarClickMensaje(key);
                div.onmousedown = (e) => { pressTimer = setTimeout(() => activarSeleccion(key), 600); };
                div.onmouseup = () => clearTimeout(pressTimer);
                div.ontouchstart = (e) => { pressTimer = setTimeout(() => activarSeleccion(key), 600); };
                div.ontouchend = () => clearTimeout(pressTimer);

                div.innerHTML = `<div class="msg ${esMio?'me':'other'}" ondblclick="reaccionar(event,'${key}')">
                                    <div class="msg-body">${renderContent(d, esMio)}</div>
                                    <div class="status-info">${d.h} ${esMio ? (d.r ? '<i class="fas fa-check-double" style="color:#88ccff"></i>' : '<i class="fas fa-check"></i>') : ''}</div>
                                </div>`;
                box.appendChild(div);
                scrollToBottom();
            });

            db.ref(salaActual).on("child_changed", (snap) => {
                const el = document.getElementById(`cont-${snap.key}`);
                if(el) {
                    const d = snap.val();
                    el.querySelector(".msg-body").innerHTML = renderContent(d, d.u === usuarioActual);
                    if(d.u === usuarioActual) el.querySelector(".status-info").innerHTML = `${d.h} ${d.r ? '<i class="fas fa-check-double" style="color:#88ccff"></i>' : '<i class="fas fa-check"></i>'}`;
                }
            });

            db.ref(salaActual).on("child_removed", (snap) => {
                const el = document.getElementById(`cont-${snap.key}`);
                if(el) el.remove();
            });
        }

        function activarSeleccion(key) { if(mensajesSeleccionados.length === 0) { mensajesSeleccionados.push(key); actualizarInterfazSeleccion(); } }
        
        function manejarClickMensaje(key) { 
            if(mensajesSeleccionados.length > 0) {
                if(mensajesSeleccionados.includes(key)) mensajesSeleccionados = mensajesSeleccionados.filter(i => i !== key);
                else mensajesSeleccionados.push(key);
                actualizarInterfazSeleccion();
            }
        }

        function actualizarInterfazSeleccion() {
            const count = mensajesSeleccionados.length;
            document.getElementById('chat-header-normal').style.display = count > 0 ? 'none' : 'flex';
            document.getElementById('chat-header-selection').style.display = count > 0 ? 'flex' : 'none';
            document.getElementById('selection-count').innerText = count;
            document.getElementById('reply-btn-header').style.display = count === 1 ? 'flex' : 'none';
            document.querySelectorAll('.msg-container').forEach(el => {
                const id = el.id.replace('cont-', '');
                el.classList.toggle('selected', mensajesSeleccionados.includes(id));
            });
        }

        function cancelarSeleccion() { mensajesSeleccionados = []; actualizarInterfazSeleccion(); }

        function prepararRespuesta() {
            const key = mensajesSeleccionados[0];
            db.ref(`${salaActual}/${key}`).once('value', snap => {
                const d = snap.val();
                mensajeParaResponder = { u: d.u, t: d.t || "Archivo" };
                document.getElementById('reply-user').innerText = d.u;
                document.getElementById('reply-text').innerText = d.t || "Archivo";
                document.getElementById('reply-preview').style.display = 'block';
                cancelarSeleccion();
                document.getElementById('msg-input').focus();
            });
        }

        function cancelarRespuesta() { mensajeParaResponder = null; document.getElementById('reply-preview').style.display = 'none'; }

        function enviar() {
            const i = document.getElementById('msg-input');
            const val = i.value.trim();
            if ((val || isRecording) && salaActual) {
                const now = new Date();
                const h = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
                const msgData = { u: usuarioActual, t: val, h: h, r: false };
                if (mensajeParaResponder) msgData.reply = mensajeParaResponder;
                db.ref(salaActual).push(msgData);
                i.value = ""; i.style.height = 'auto';
                cancelarRespuesta();
            }
        }

        async function toggleAudio() {
            const btn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const ref = storage.ref(`audios/${Date.now()}.webm`);
                        await ref.put(blob);
                        const url = await ref.getDownloadURL();
                        const h = new Date().getHours() + ":" + new Date().getMinutes().toString().padStart(2, '0');
                        db.ref(salaActual).push({ u: usuarioActual, file: url, fileType: 'audio', h: h, r: false });
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start(); isRecording = true; btn.classList.add('recording');
                } catch (err) { alert("Micrófono no disponible"); }
            } else { mediaRecorder.stop(); isRecording = false; btn.classList.remove('recording'); }
        }

        async function enviarArchivo(input) {
            const file = input.files[0];
            if (file) {
                const ref = storage.ref(`files/${Date.now()}_${file.name}`);
                await ref.put(file);
                const url = await ref.getDownloadURL();
                const h = new Date().getHours() + ":" + new Date().getMinutes().toString().padStart(2, '0');
                db.ref(salaActual).push({ u: usuarioActual, file: url, fileType: file.type, h: h, r: false });
            }
        }

        function reaccionar(e, id) {
            e.stopPropagation(); msgIdParaReaccionar = id;
            const s = document.getElementById('reaction-selector');
            s.style.display = 'grid';
            s.style.top = (e.clientY > window.innerHeight/2 ? e.clientY-120 : e.clientY+20) + 'px';
            s.style.left = Math.max(10, Math.min(window.innerWidth-230, e.clientX-100)) + 'px';
        }

        function aplicarReaccion(emoji) { db.ref(`${salaActual}/${msgIdParaReaccionar}/reacciones/${emoji}`).transaction(v => (v || 0) + 1); cerrarSelectores(); }
        
        function scrollToBottom() { const b = document.getElementById("messages"); b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
        
        function handleScroll(el) { document.getElementById('scroll-down').style.display = (el.scrollHeight - el.scrollTop > el.clientHeight + 150) ? 'flex' : 'none'; }

        function volverAContactos() { 
            if(salaActual) { db.ref(salaActual).off(); db.ref(`typing/${salaActual}`).off(); }
            salaActual = ""; 
            localStorage.setItem('urrichat_last_room', 'contacts');
            document.getElementById('chat-container').style.display = 'none'; 
            document.getElementById('contacts-container').style.display = 'flex'; 
        }

        function cerrarSelectores() { document.getElementById('emoji-picker').style.display = 'none'; document.getElementById('reaction-selector').style.display = 'none'; }
        function toggleEmojiPicker(e) { e.stopPropagation(); const p = document.getElementById('emoji-picker'); p.style.display = p.style.display==='grid'?'none':'grid'; }
        function addEmoji(e) { document.getElementById('msg-input').value += e; }
        function vaciarChat() { if(confirm("¿Vaciar chat?")) db.ref(salaActual).remove(); }
        function borrarMensajesSeleccionados() { if (confirm("¿Borrar seleccionados?")) { mensajesSeleccionados.forEach(k => db.ref(`${salaActual}/${k}`).remove()); cancelarSeleccion(); } }
        function confirmarSalida() { if (confirm("¿Cerrar sesión?")) { db.ref("usuarios/" + usuarioActual).set("offline").then(() => { localStorage.clear(); location.reload(); }); } }

        function editarNombre() {
            let n = prompt("Nuevo nombre:", usuarioActual);
            if (n && n.trim() !== "") {
                db.ref("usuarios/" + usuarioActual).set("offline");
                usuarioActual = n.trim(); localStorage.setItem('urrichat_user', usuarioActual); location.reload();
            }
        }

        window.onload = () => { 
            const saved = localStorage.getItem('urrichat_user');
            if(saved) { document.getElementById('username').value = saved; registrarUsuario(saved); }
            else { document.getElementById('login').style.display = 'flex'; }
        };
    </script>
</body>
</html>
